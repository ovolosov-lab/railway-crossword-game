<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{{ register_page_title }}</title>
    <link rel="stylesheet" href="/static/auth.css">
    <script id="i18n-data" type="application/json">{{ {"lang": lang, "js": translations} | tojson }}</script>
    <script src="/static/register.js" defer></script>
  </head>
  <body>
    <main class="auth-layout">
      <section class="auth-card" aria-labelledby="register-title">
        <a class="brand" href="/" aria-label="{{ brand_aria_label }}">
          <span class="brand-mark" aria-hidden="true">🛤️</span>
          <span class="game-title">{{ game_title2 }}</span>
        </a>

        <div class="auth-heading">
          <p class="eyebrow">{{ register_eyebrow }}</p>
          <h1 id="register-title">{{ register_heading }}</h1>
          <p class="intro">{{ register_intro }}</p>
        </div>

        <form id="register-form" class="auth-form" action="/auth/register/" method="post">
          <label for="username">{{ username_label }}</label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            minlength="1"
            maxlength="32"
            required
          >

          <label for="email">{{ email_label }}</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            inputmode="email"
            maxlength="254"
            placeholder="you@example.com"
            required
          >

          <label for="password">{{ password_label }}</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            maxlength="72"
            required
          >

          <label for="password-confirmation">{{ password_confirmation_label }}</label>
          <input
            id="password-confirmation"
            name="password_confirmation"
            type="password"
            autocomplete="new-password"
            minlength="8"
            maxlength="72"
            required
          >

          <p id="form-message" class="form-message" role="alert" aria-live="polite" hidden></p>

          <button id="submit-button" class="submit-button" type="submit">
            <span class="button-label">{{ register_submit }}</span>
            <span class="button-spinner" aria-hidden="true"></span>
          </button>
        </form>

        <p class="auth-footer">
          {{ login_prompt }}
          <a href="/login/">{{ login_link }}</a>
        </p>
      </section>

      <aside class="auth-aside" aria-label="{{ auth_about }}">
        <div class="route-illustration" aria-hidden="true">
          <span class="city city-start"></span>
          <span class="rail-line"></span>
          <span class="city city-end"></span>
        </div>
        <p class="aside-kicker">{{ register_aside_kicker }}</p>
        <p class="aside-copy">{{ auth_aside_copy }}</p>
      </aside>
    </main>
  </body>
</html>
