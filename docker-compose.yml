services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-Railway}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PORT: 5432
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-access_token}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-csrf_token}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      GAME_DURATION_HOURS: ${GAME_DURATION_HOURS:-6}
      CHECK_INTERVAL: ${CHECK_INTERVAL:-40}
      USER_GUESS_RATE_LIMIT: ${USER_GUESS_RATE_LIMIT:-30}
      FRONTEND_SYNC_INTERVAL: ${FRONTEND_SYNC_INTERVAL:-2}
      HINT_FIRST_LETTER_COST: ${HINT_FIRST_LETTER_COST:-20}
      HINT_LAST_LETTER_COST: ${HINT_LAST_LETTER_COST:-30}
    ports:
      - "80:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in the root .env file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in the root .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
